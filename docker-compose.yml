# `docker compose up --build` starts Postgres and two instances of the routing service.
# `docker compose run --rm sim` runs the simulation against both instances.

x-app: &app
  build: .
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

x-app-env: &app-env
  DATABASE_URL: postgres://routing:routing@db:5432/routing
  OFFER_TIMEOUT_MS: ${OFFER_TIMEOUT_MS:-15000}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: routing
      POSTGRES_DB: routing
    ports:
      - "55432:5432" # not 5432, so it does not clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing"]
      interval: 2s
      timeout: 3s
      retries: 30

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "8081:8080"

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports:
      - "8082:8080"

  # The test script. Not started by `docker compose up`; run it with `docker compose run --rm sim`.
  sim:
    build: .
    profiles: ["sim"]
    command: ["node", "sim/simulate.ts"]
    environment:
      DATABASE_URL: postgres://routing:routing@db:5432/routing
      SIM_URLS: http://app1:8080,http://app2:8080
    depends_on:
      - app1
      - app2
